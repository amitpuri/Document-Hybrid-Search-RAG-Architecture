services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_local
    ports:
      - "6333:6333"   # REST API & Web Dashboard (http://localhost:6333/dashboard)
      - "6334:6334"   # gRPC API
    volumes:
      - ./qdrant_storage:/qdrant/storage:z
    restart: unless-stopped
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
